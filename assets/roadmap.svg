<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="path" x1="0" x2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="380" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="378" rx="15" fill="none" stroke="#30363d"/>

  <text x="32" y="48" fill="#f0f6fc" font-size="18" font-family="monospace" font-weight="700">./roadmap --backend</text>
  <text x="32" y="73" fill="#8b949e" font-size="13" font-family="monospace">current route</text>

  <line x1="95" y1="190" x2="905" y2="190" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
  <line x1="95" y1="190" x2="905" y2="190" stroke="url(#path)" stroke-width="8" stroke-linecap="round" stroke-dasharray="150 900">
    <animate attributeName="stroke-dashoffset" values="0;-1050" dur="4.8s" repeatCount="indefinite"/>
  </line>

  <g font-family="monospace" text-anchor="middle">
    <g>
      <circle cx="95" cy="190" r="16" fill="#238636"/>
      <text x="95" y="230" fill="#f0f6fc" font-size="13">Java</text>
    </g>
    <g>
      <circle cx="230" cy="190" r="16" fill="#238636"/>
      <text x="230" y="230" fill="#f0f6fc" font-size="13">OOP</text>
    </g>
    <g>
      <circle cx="365" cy="190" r="16" fill="#238636"/>
      <text x="365" y="230" fill="#f0f6fc" font-size="13">SQL</text>
    </g>
    <g>
      <circle cx="500" cy="190" r="16" fill="#d29922">
        <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="500" y="230" fill="#f0f6fc" font-size="13">JPA</text>
      <text x="500" y="254" fill="#d29922" font-size="11">CURRENT</text>
    </g>
    <g>
      <circle cx="635" cy="190" r="16" fill="#30363d"/>
      <text x="635" y="230" fill="#f0f6fc" font-size="13">Spring</text>
    </g>
    <g>
      <circle cx="770" cy="190" r="16" fill="#30363d"/>
      <text x="770" y="230" fill="#f0f6fc" font-size="13">Docker</text>
    </g>
    <g>
      <circle cx="905" cy="190" r="16" fill="#30363d"/>
      <text x="905" y="230" fill="#f0f6fc" font-size="13">Cloud</text>
    </g>
  </g>

  <rect x="205" y="305" width="590" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="328" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="13">next checkpoint → back-end developer</text>

  <rect x="782" y="310" width="7" height="17" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
