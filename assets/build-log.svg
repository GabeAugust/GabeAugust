<svg width="960" height="610" viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="active" x1="0" x2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="610" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="958" height="608" rx="15" fill="none" stroke="#30363d"/>

  <circle cx="28" cy="25" r="5" fill="#ff5f57"/>
  <circle cx="46" cy="25" r="5" fill="#febc2e"/>
  <circle cx="64" cy="25" r="5" fill="#28c840"/>
  <text x="480" y="30" text-anchor="middle" fill="#8b949e" font-size="13" font-family="monospace">build.log</text>

  <text x="30" y="72" fill="#f0f6fc" font-size="16" font-family="monospace" font-weight="700">GABRIEL BUILD LOG</text>
  <text x="760" y="72" fill="#3fb950" font-size="13" font-family="monospace">● LIVE</text>
  <circle cx="746" cy="67" r="5" fill="#3fb950">
    <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <line x1="30" y1="92" x2="930" y2="92" stroke="#21262d"/>

  <g font-family="monospace" font-size="14">
    <text x="32" y="130" fill="#3fb950">✓ Java Fundamentals</text>
    <text x="690" y="130" fill="#3fb950">COMPLETE</text>

    <text x="32" y="166" fill="#3fb950">✓ Object-Oriented Programming</text>
    <text x="690" y="166" fill="#3fb950">COMPLETE</text>

    <text x="32" y="202" fill="#3fb950">✓ SQL Fundamentals</text>
    <text x="690" y="202" fill="#3fb950">COMPLETE</text>

    <text x="32" y="252" fill="#f0f6fc">◉ JPA / Hibernate</text>
    <text x="690" y="252" fill="#d29922">BUILDING</text>

    <text x="32" y="324" fill="#f0f6fc">◉ Spring Boot</text>
    <text x="690" y="324" fill="#d29922">BUILDING</text>

    <text x="32" y="396" fill="#f0f6fc">◉ REST APIs</text>
    <text x="690" y="396" fill="#58a6ff">RUNNING</text>

    <text x="32" y="468" fill="#8b949e">○ Docker</text>
    <text x="690" y="468" fill="#8b949e">QUEUED</text>
  </g>

  <!-- bars -->
  <g>
    <rect x="32" y="266" width="870" height="13" rx="6.5" fill="#21262d"/>
    <rect x="32" y="338" width="870" height="13" rx="6.5" fill="#21262d"/>
    <rect x="32" y="410" width="870" height="13" rx="6.5" fill="#21262d"/>
    <rect x="32" y="482" width="870" height="13" rx="6.5" fill="#21262d"/>

    <rect x="32" y="266" height="13" rx="6.5" fill="url(#active)" filter="url(#glow)">
      <animate attributeName="width" values="80;700;360;700" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <rect x="32" y="338" height="13" rx="6.5" fill="url(#active)" filter="url(#glow)">
      <animate attributeName="width" values="50;590;290;590" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="32" y="410" height="13" rx="6.5" fill="#58a6ff">
      <animate attributeName="width" values="100;500;260;500" dur="4.2s" repeatCount="indefinite"/>
