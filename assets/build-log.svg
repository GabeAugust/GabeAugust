    <rect x="32" y="482" width="70" height="13" rx="6.5" fill="#30363d">
      <animate attributeName="x" values="32;832;32" dur="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="30" y1="525" x2="930" y2="525" stroke="#21262d"/>

  <text x="32" y="558" fill="#8b949e" font-family="monospace" font-size="14">compiling next version of Gabriel</text>
  <text x="300" y="558" fill="#3fb950" font-family="monospace" font-size="16">
    .
    <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
  </text>
  <text x="314" y="558" fill="#3fb950" font-family="monospace" font-size="16">
    .
    <animate attributeName="opacity" values="0;0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
  </text>
  <text x="328" y="558" fill="#3fb950" font-family="monospace" font-size="16">
    .
    <animate attributeName="opacity" values="0;0;0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </text>

  <text x="32" y="587" fill="#3fb950" font-family="monospace" font-size="14">$</text>
  <rect x="48" y="575" width="9" height="15" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>