<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="248" rx="17" fill="none" stroke="#30363d"/>

  <circle cx="32" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="28" r="6" fill="#febc2e"/>
  <circle cx="72" cy="28" r="6" fill="#28c840"/>
  <text x="500" y="33" fill="#8b949e" font-size="14" font-family="monospace" text-anchor="middle">gabriel@github: ~/profile</text>

  <text x="60" y="96" fill="#3fb950" font-size="20" font-family="monospace">$ whoami</text>

  <text x="60" y="145" fill="#f0f6fc" font-size="40" font-weight="700" font-family="Arial, sans-serif">Gabriel Pereira</text>
  <text x="60" y="181" fill="#8b949e" font-size="21" font-family="monospace">Software Engineering • Java • Spring • Back-end</text>

  <rect x="60" y="204" width="620" height="6" rx="3" fill="#21262d"/>
  <rect x="60" y="204" width="0" height="6" rx="3" fill="url(#accent)" filter="url(#softGlow)">
    <animate attributeName="width" values="0;620;620;0" keyTimes="0;0.62;0.86;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="710" y="213" fill="#3fb950" font-size="15" font-family="monospace">building profile</text>
  <text x="858" y="213" fill="#3fb950" font-size="15" font-family="monospace">
    .
    <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="872" y="213" fill="#3fb950" font-size="15" font-family="monospace">
    .
    <animate attributeName="opacity" values="0;0;1;1;0" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="886" y="213" fill="#3fb950" font-size="15" font-family="monospace">
    .
    <animate attributeName="opacity" values="0;0;0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>